# Opt-in only. Create .secrets/discord_webhook before using this override.
# Commands must supply the account and secret file explicitly; `up` cannot send.
services:
  notifications:
    extends:
      file: compose.yaml
      service: app
    profiles: [notifications]
    command: [aca, notifications, --help]
    networks: [private, notifications_egress]
    secrets: [runtime_password, discord_webhook]
    restart: "no"
    healthcheck:
      disable: false
      test: [CMD, aca, health, --url, "http://127.0.0.1:8000/health/notifications"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 2

networks:
  notifications_egress:

secrets:
  discord_webhook:
    file: .secrets/discord_webhook
