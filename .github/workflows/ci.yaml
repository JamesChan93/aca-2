name: Platform checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/development.lock
          python -m pip install --require-hashes -r requirements/research.lock
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
      - name: Static checks
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
      - name: Real PostgreSQL integration and unit tests on Linux musl
        run: python scripts/ci_database.py --linux
      - name: Restore an exported snapshot during controlled paper commits
        run: python scripts/restore_drill.py
      - name: Bounded PostgreSQL WAL ENOSPC and disarmed recovery
        run: python scripts/storage_fault_drill.py
      - name: Measure bounded paper capacity (does not approve C3 or G2)
        run: python scripts/capacity_trial.py
      - name: Dependency audit
        run: |
          pip-audit --disable-pip --require-hashes -r requirements/research.lock
          pip-audit --disable-pip --require-hashes -r requirements/runtime.lock
          pip-audit --disable-pip --require-hashes -r requirements/development.lock
      - name: Build and inspect distributable
        run: python -m build --no-isolation
      - name: Container build and paper-only smoke check
        run: |
          python scripts/bootstrap.py
          docker compose exec -T app python -c 'import os; assert os.geteuid() == 10001'
          docker compose exec -T app aca db check
          docker compose exec -T app aca capabilities
          docker compose exec -T app aca market status
          docker compose exec -T app aca market evidence --channel instrument_rules --limit 1
          docker compose exec -T app aca paper demo --account 6e04530b-9382-418d-9a24-331672f4016b > /tmp/aca-paper-demo.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-demo.json")); assert d["promotion_evidence"] is False; assert d["live_execution_available"] is False; assert d["blocked_steps"] == 0'
          docker compose restart app
          python scripts/container_smoke.py
          docker compose exec -T app aca paper recover --account 6e04530b-9382-418d-9a24-331672f4016b
          docker compose exec -T app aca paper audit --account 6e04530b-9382-418d-9a24-331672f4016b
          docker compose exec -T app aca paper tax-reserves --account 6e04530b-9382-418d-9a24-331672f4016b --limit 2 > /tmp/aca-tax-reserves.json
          python -c 'import json; d=json.load(open("/tmp/aca-tax-reserves.json")); assert d["items"] == []; assert d["next_after_version"] is None; assert d["tax_estimate"] is False; assert d["tax_report_final"] is False; assert d["live_execution_available"] is False; assert d["state_version"] >= 1'
          docker compose exec -T app aca notifications status --account 6e04530b-9382-418d-9a24-331672f4016b > /tmp/aca-notifications.json
          python -c 'import json; d=json.load(open("/tmp/aca-notifications.json")); assert d["configured"] is False; assert d["backlog"] >= 1; assert d["delivered"] == 0; assert d["live_execution_available"] is False; assert d["as_of"]; assert isinstance(d["scheduled_queues"], dict); assert d["reviewed_terminal_failures"] == d["unreviewed_terminal_failures"] == 0'
          docker compose exec -T app aca notifications failures --account 6e04530b-9382-418d-9a24-331672f4016b --limit 2 > /tmp/aca-notification-failures.json
          python -c 'import json; d=json.load(open("/tmp/aca-notification-failures.json")); assert d["items"] == []; assert d["next_after_number"] is None; assert d["live_execution_available"] is False'
          docker compose exec -T app aca notifications prepare --account 6e04530b-9382-418d-9a24-331672f4016b > /tmp/aca-notice-preparation.json
          python -c 'import json; d=json.load(open("/tmp/aca-notice-preparation.json")); assert d["live_execution_available"] is False; assert d["daily_evidence_unavailable"] is False'
          docker compose exec -T app aca notifications notices --account 6e04530b-9382-418d-9a24-331672f4016b --limit 2 > /tmp/aca-notice-preview.json
          python -c 'import json; d=json.load(open("/tmp/aca-notice-preview.json")); assert d["live_execution_available"] is False; assert isinstance(d["items"], list)'
          docker compose run --rm --no-deps app aca paper supervise --account 6e04530b-9382-418d-9a24-331672f4016b --duration 3 > /tmp/aca-paper-supervision.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-supervision.json")); assert d["strategy_dispatch_enabled"] is False; assert d["fill_replay_enabled"] is False; assert d["trading_ready"] is False; assert d["ticks"] >= 1; assert d["reason"] == "paper_supervisor_stopped"'
          docker compose exec -T app aca paper enrol --account 6e04530b-9382-418d-9a24-331672f4016b
          docker compose exec -T app aca paper consume --account 6e04530b-9382-418d-9a24-331672f4016b --limit 32
          docker compose exec -T app aca paper valuations --account 6e04530b-9382-418d-9a24-331672f4016b --limit 2 > /tmp/aca-paper-valuations.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-valuations.json")); assert d["provisional"] is True; assert d["promotion_evidence"] is False; assert d["live_execution_available"] is False; assert len(d["items"]) >= 1'
          docker compose exec -T app aca paper performance --account 6e04530b-9382-418d-9a24-331672f4016b > /tmp/aca-paper-performance.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-performance.json")); assert d["provisional"] is True; assert d["promotion_evidence"] is False; assert d["live_execution_available"] is False; assert d["period"]["observations"] >= 1; assert d["financial_evidence_reconciled"] is True'
          docker compose run --rm --no-deps app aca paper supervise --account 6e04530b-9382-418d-9a24-331672f4016b --replay --duration 3 > /tmp/aca-paper-ordered-replay.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-ordered-replay.json")); assert d["strategy_dispatch_enabled"] is False; assert d["fill_replay_enabled"] is True; assert d["promotion_evidence"] is False; assert d["trading_ready"] is False; assert d["ticks"] >= 1; assert d["reason"] == "paper_supervisor_stopped"'
          docker compose exec -T app aca paper create --account c0e44fce-9604-4484-86ad-21ddd063ec75
          docker compose exec -T app aca paper fund --account c0e44fce-9604-4484-86ad-21ddd063ec75 --reference ci-opening --amount-gbp 250 --occurred-at "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          docker compose exec -T app aca paper select --account c0e44fce-9604-4484-86ad-21ddd063ec75 --strategy sma200 --symbol BTC/GBP --interval 240 --operational-experiment
          docker compose exec -T app aca paper enrol --account c0e44fce-9604-4484-86ad-21ddd063ec75
          docker compose run --rm --no-deps app aca paper run --account c0e44fce-9604-4484-86ad-21ddd063ec75 --duration 3 > /tmp/aca-paper-strategy.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-strategy.json")); assert d["kind"] == "paper_strategy_runner_v1"; assert d["strategy_dispatch_enabled"] is True; assert d["fill_replay_enabled"] is True; assert d["trading_ready"] is False; assert d["qualifying_days"] == d["qualifying_episodes"] == 0; assert d["ticks"] >= 1'
          docker compose exec -T app aca paper decisions --account c0e44fce-9604-4484-86ad-21ddd063ec75 > /tmp/aca-paper-decisions.json
          python -c 'import json; d=json.load(open("/tmp/aca-paper-decisions.json")); assert d["selection"]["operational_only"] is True; assert d["decisions"] == []; assert d["promotion_evidence"] is False'
          docker compose exec -T app python - < tests/accounting_cli_worker.py > /tmp/aca-accounting-smoke.json
          python -c 'import json; d=json.load(open("/tmp/aca-accounting-smoke.json")); assert d["passed"] is True; assert d["after"]["state"]["accounting_invalidated"] is True; assert d["qualifying_days"] == d["qualifying_episodes"] == 0; assert d["live_execution_available"] is False'
      - name: Scan application image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: aca-foundation:0.4.12
          version: v0.76.0
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Scan database image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: aca-postgres:18.6
          version: v0.76.0
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Stop local services
        if: always()
        run: docker compose down
