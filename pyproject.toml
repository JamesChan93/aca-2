[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aca-platform"
version = "0.4.10"
description = "Kraken research and durable local paper accounting and execution"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "LicenseRef-Proprietary"
dependencies = [
  "SQLAlchemy[asyncio]==2.1.5",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "structlog==26.1.0",
  "prometheus-client==0.26.0",
  "httpx==0.28.1",
  "websockets==17.2",
]

[project.optional-dependencies]
research = ["numpy==2.5.4"]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.170.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "pip-tools==7.6.2",
  "build==1.6.1",
  "hatchling==1.32.4",
  "pip-audit==2.10.1",
]

[project.scripts]
aca = "aca.operations.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = ["integration: requires real PostgreSQL and TEST_DATABASE_URL"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/aca", "tests"]
exclude = ["src/aca/storage/migrations/"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "requirements", "docs", "scripts", "pyproject.toml", "README.md"]
